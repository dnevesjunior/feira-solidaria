# /etc/nginx/sites-available/feira.reciboemdia.com.br
# kamal-proxy escuta em 127.0.0.1:8080 (ADR 0003). O certbot acrescenta o bloco TLS.
server {
    listen 80;
    server_name feira.reciboemdia.com.br;

    client_max_body_size 20m;   # fotos de celular (Epic 1)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
